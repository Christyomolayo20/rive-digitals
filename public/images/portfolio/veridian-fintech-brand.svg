    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>
  <!-- Brand Guidelines Sheet Card Left -->
  <rect x="80" y="90" width="520" height="620" rx="20" fill="#0C2031" stroke="#1E3D56" stroke-width="2"/>
