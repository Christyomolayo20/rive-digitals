  <text x="410" y="398" fill="#64748B" font-family="monospace" font-size="12">#10B981</text>

  <rect x="350" y="428" width="210" height="62" rx="10" fill="#FFFFFF"/>
  <circle cx="382" cy="459" r="14" fill="#06141F"/>
  <text x="410" y="455" fill="#06141F" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Deep Midnight</text>
  <text x="410" y="472" fill="#475569" font-family="monospace" font-size="12">#06141F</text>

  <!-- Typography Specimen -->
  <rect x="120" y="515" width="440" height="155" rx="14" fill="#06141F" stroke="#1E3D56"/>
  <text x="148" y="575" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="800">Aa Bb Cc</text>
