  <!-- Logo Construction Grid Box -->
  <rect x="120" y="280" width="210" height="210" rx="16" fill="#06141F" stroke="#1E3D56"/>
  <path d="M185 340L225 430L265 340H242L225 382L208 340H185Z" fill="#FFFFFF"/>
  <circle cx="225" cy="335" r="8" fill="#D86875"/>
  <!-- Color Swatches -->
  <rect x="350" y="280" width="210" height="62" rx="10" fill="#06141F" stroke="#1E3D56"/>
  <circle cx="382" cy="311" r="14" fill="#D86875"/>
