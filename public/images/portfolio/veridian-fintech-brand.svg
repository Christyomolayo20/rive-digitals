  <text x="410" y="324" fill="#64748B" font-family="monospace" font-size="12">#D86875</text>

  <rect x="350" y="354" width="210" height="62" rx="10" fill="#06141F" stroke="#1E3D56"/>
  <circle cx="382" cy="385" r="14" fill="#10B981"/>
