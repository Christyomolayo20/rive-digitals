  <text x="680" y="275" fill="#FFFFFF" font-family="monospace" font-size="24" letter-spacing="4">4921  ••••  ••••  8044</text>
  <text x="680" y="340" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" letter-spacing="1.5">CORPORATE TREASURY CARD</text>
